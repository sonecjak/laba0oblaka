server {
    listen 80;
    server_name _;

    # у докера внутри есть свой DNS, через него nginx узнаёт, где живёт backend
    # valid=10s: если бэкенд перезапустится с другим IP, nginx через 10 сек это заметит
    resolver 127.0.0.11 valid=10s;

    # отсюда отдаём саму страничку с заметками (папка laba2/good/frontend)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # всё, что начинается с /api/, отправляем бэкенду
    # пишем просто "backend", это имя сервиса из docker-compose.yml
    location /api/ {
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
}