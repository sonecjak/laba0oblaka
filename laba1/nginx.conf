events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # [У2] Rate limit: не больше 5 запросов/сек с одного IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
    limit_req_status 429;

    upstream backend_nodes {
        server host.docker.internal:5001 max_fails=1 fail_timeout=5s;
        server host.docker.internal:5002 max_fails=1 fail_timeout=5s;
    }

    # [У2] Чужой домен на 80 — просто закрываем соединение
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    # Редирект HTTP -> HTTPS (301) для наших доменов
    server {
        listen 80;
        server_name localhost project2.local;
        return 301 https://$host$request_uri;
    }

    # [У2] Чужой домен на 443 — ничего не отдаём
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_certificate     /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        return 444;
    }

    # Основной сайт
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # [У2] Своя страница 404
        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/errors;
            internal;
        }

        # Фронтенд
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;   # [У2] было /index.html, иначе 404 никогда не сработает
        }

        # Прокси на API
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;   # [У2]

            proxy_pass http://backend_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503;
        }

        # [У2] alias: /docs/ отдаётся из отдельной папки
        location /docs/ {
            alias /var/www/docs/;
            index index.html;
        }

        # [У2] /admin закрыт паролем
        location = /admin { return 301 /admin/; }
        location /admin/ {
            auth_basic           "Admin area";
            auth_basic_user_file /etc/nginx/.htpasswd;
            alias /var/www/admin/;
            index index.html;
        }
    }

    # [У2] Второй виртуальный хост
    server {
        listen 443 ssl;
        server_name project2.local;

        ssl_certificate     /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;

        root /var/www/site2;
        index index.html;
        location / {
            try_files $uri $uri/ =404;
        }
    }
}